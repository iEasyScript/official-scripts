# Builds this repo's script jar and publishes it as a release asset.
#
# The launcher installs the jar straight from the newest release, verifying it
# against the .sha256 published beside it, so a tag here is what reaches users.
# A branch push builds the same jar as a workflow artifact, so a break surfaces
# before a tag depends on it.
name: release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.$GITHUB_RUN_NUMBER.$(echo "$GITHUB_SHA" | cut -c1-8)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # The wrapper loses its executable bit when committed from Windows, so set
      # it here rather than depending on the file mode in the repo.
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --stacktrace -Pversion=${{ steps.v.outputs.version }} jar

      # The launcher matches an asset by filename prefix, so the jar must carry
      # the repo's channel name.
      - name: Stage
        id: stage
        run: |
          set -eu
          v='${{ steps.v.outputs.version }}'
          name="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist
          src="$(find build/libs -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          cp "$src" "dist/$name-$v.jar"
          cd dist
          sha256sum "$name-$v.jar" > "$name-$v.jar.sha256"
          cat "$name-$v.jar.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
